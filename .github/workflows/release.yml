name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          LATEST_TAG="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)"
          if [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
          else
            BASE="$(tr -d '[:space:]' < VERSION)"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > VERSION
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW_VERSION}"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: VERSION
          if-no-files-found: error

  build-frontend:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply release version
        shell: bash
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend static export
        working-directory: web
        run: npm run build

      - name: Verify frontend artifact
        shell: bash
        run: test -f web/out/index.html

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: web/out
          if-no-files-found: error

  build-backend:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply release version
        shell: bash
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build backend Windows EXE
        run: pyinstaller --noconfirm account-inventory-web.spec

      - name: Build updater Windows EXE
        run: pyinstaller --noconfirm --onefile --name updater updater.py

      - name: Verify backend artifact
        shell: bash
        run: |
          test -f dist/account-inventory-web.exe
          test -f dist/updater.exe

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: |
            dist/account-inventory-web.exe
            dist/updater.exe
          if-no-files-found: error

  package-release:
    runs-on: windows-latest
    needs:
      - version
      - build-frontend
      - build-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: release-package/web/out

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-exe
          path: release-package

      - name: Download VERSION artifact
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: release-package

      - name: Add run helper
        shell: pwsh
        run: |
          @'
          @echo off
          account-inventory-web.exe
          '@ | Set-Content -Path release-package\start-web.bat -Encoding ASCII

      - name: Add release README
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $readme = @(
            "# 账号出入库管理 Release $version"
            ""
            "## 推荐下载"
            ""
            "普通用户推荐下载："
            "- account-inventory-web-windows.zip"
            ""
            "需要固定版本归档时下载："
            "- account-inventory-web-$version-windows.zip"
            ""
            "不建议普通用户下载 Source code。源码包是 GitHub 自动生成的仓库源码快照，不包含已经编译好的 Windows EXE，也不包含构建好的前端静态产物。"
            ""
            "## Release 文件说明"
            ""
            "- account-inventory-web-$version-windows.zip"
            "  - 带版本号的完整 Windows 发布包。"
            "  - 内容包含 account-inventory-web.exe、updater.exe、web/out 前端静态产物、VERSION、start-web.bat 和本 README。"
            "  - 适合需要保留指定版本的用户下载。"
            ""
            "- account-inventory-web-windows.zip"
            "  - 稳定文件名的完整 Windows 发布包，内容与带版本号 zip 相同。"
            "  - 适合普通用户下载，也供自动更新程序固定查找。"
            ""
            "- account-inventory-web-windows.zip.sha256"
            "  - account-inventory-web-windows.zip 的 SHA256 校验文件。"
            "  - 用于确认下载文件没有损坏或被替换。"
            ""
            "- Source code (zip)"
            "  - GitHub 自动生成的源码压缩包。"
            "  - 不包含可直接运行的 EXE 和 web/out 构建产物。"
            ""
            "- Source code (tar.gz)"
            "  - GitHub 自动生成的源码压缩包，tar.gz 格式。"
            "  - 不包含可直接运行的 EXE 和 web/out 构建产物。"
            ""
            "## 发布包内文件说明"
            ""
            "- account-inventory-web.exe"
            "  - 主程序后端 EXE，启动后提供本地 Web 服务。"
            ""
            "- updater.exe"
            "  - 自动更新辅助程序。"
            ""
            "- start-web.bat"
            "  - Windows 双击启动脚本，会运行 account-inventory-web.exe。"
            ""
            "- web/out"
            "  - 已构建完成的前端静态页面产物。"
            ""
            "- VERSION"
            "  - 当前发布版本号。"
            ""
            "- README.txt"
            "  - 本说明文件。"
          )
          $readme | Set-Content -Path release-package\README.txt -Encoding UTF8
          Copy-Item release-package\README.txt README.txt -Force

      - name: Verify release package
        shell: bash
        run: |
          test -f release-package/account-inventory-web.exe
          test -f release-package/updater.exe
          test -f release-package/web/out/index.html
          test -f release-package/VERSION
          test -f release-package/start-web.bat
          test -f release-package/README.txt
          test -f README.txt

      - name: Compress release package
        shell: pwsh
        run: |
          $versioned = "account-inventory-web-${{ needs.version.outputs.version }}-windows.zip"
          $stable = "account-inventory-web-windows.zip"
          Compress-Archive `
            -Path release-package\* `
            -DestinationPath $versioned `
            -Force
          Copy-Item $versioned $stable -Force
          $hash = (Get-FileHash -Algorithm SHA256 $stable).Hash.ToLower()
          "$hash  $stable" | Set-Content -Path "$stable.sha256" -Encoding ASCII

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          files: |
            account-inventory-web-${{ needs.version.outputs.version }}-windows.zip
            account-inventory-web-windows.zip
            account-inventory-web-windows.zip.sha256
            README.txt
          generate_release_notes: true
          overwrite_files: true
          make_latest: true

      - name: Commit VERSION bump
        shell: bash
        run: |
          cp release-package/VERSION VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --staged --quiet && exit 0
          git commit -m "chore: bump version to ${{ needs.version.outputs.version }} [skip ci]"
          git push
